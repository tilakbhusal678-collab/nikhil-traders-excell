<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Business Sheet</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    overflow:hidden;
    color:#222;
}

.topbar{
    height:58px;
    background:#1f2937;
    color:white;
    display:flex;
    align-items:center;
    gap:15px;
    padding:8px 12px;
    flex-wrap:wrap;
}

.logo{
    font-size:19px;
    font-weight:bold;
    white-space:nowrap;
}

button{
    border:0;
    border-radius:5px;
    padding:8px 11px;
    background:#374151;
    color:white;
    cursor:pointer;
    font-size:13px;
}

button:hover{
    background:#4b5563;
}

button.red{
    background:#b91c1c;
}

button.green{
    background:#047857;
}

.search{
    margin-left:auto;
    width:190px;
    padding:8px;
    border:0;
    border-radius:5px;
    outline:none;
}

.formula{
    height:42px;
    background:white;
    border-bottom:1px solid #ccc;
    display:flex;
}

.namebox{
    width:75px;
    min-width:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e5e7eb;
    border-right:1px solid #ccc;
    font-weight:bold;
}

#formula{
    flex:1;
    border:0;
    outline:none;
    padding:0 12px;
    font-size:14px;
}

.sheet{
    position:absolute;
    top:100px;
    bottom:30px;
    left:0;
    right:0;
    overflow:auto;
    background:white;
}

#grid{
    position:relative;
}

.cell{
    position:absolute;
    width:120px;
    height:28px;
    border-right:1px solid #d1d5db;
    border-bottom:1px solid #d1d5db;
    background:white;
    padding:5px 7px;
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    outline:none;
}

.cell:focus{
    border:2px solid #2563eb;
    padding:4px 6px;
    z-index:10;
}

.header{
    background:#e5e7eb;
    font-weight:bold;
    text-align:center;
    user-select:none;
}

.rowhead{
    width:55px;
    left:0;
}

.status{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:30px;
    background:#1f2937;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-size:12px;
}

@media(max-width:900px){
    .search{
        display:none;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <div class="logo">📊 My Business Sheet</div>

    <button onclick="addRow()">＋ Row</button>
    <button onclick="deleteRow()">− Row</button>

    <button onclick="addColumn()">＋ Column</button>
    <button onclick="deleteColumn()">− Column</button>

    <button class="green" onclick="save()">💾 Save</button>

    <button onclick="exportCSV()">⬇ Export</button>
    <button onclick="document.getElementById('file').click()">⬆ Import</button>

    <button class="red" onclick="clearAll()">Clear All</button>

    <input
        class="search"
        id="search"
        placeholder="Search..."
        oninput="searchData()"
    >

</div>

<div class="formula">

    <div class="namebox" id="cellName">A1</div>

    <input
        id="formula"
        placeholder="Type data here..."
        oninput="formulaChanged()"
    >

</div>

<div class="sheet" id="sheet">

    <div id="grid"></div>

</div>

<div class="status">

    <span id="status">Ready</span>

    <span id="saved">Saved locally ✓</span>

</div>

<input
    type="file"
    id="file"
    accept=".csv"
    hidden
>

<script>

const MAX_ROWS = 20000;
const MAX_COLS = 500;

const ROW_HEIGHT = 28;
const COL_WIDTH = 120;
const ROW_HEADER = 55;
const HEADER_HEIGHT = 28;

let rows = 200;
let cols = 20;

let data = {};

let selectedRow = 0;
let selectedCol = 0;

const grid = document.getElementById("grid");
const sheet = document.getElementById("sheet");
const formula = document.getElementById("formula");
const cellName = document.getElementById("cellName");
const status = document.getElementById("status");
const saved = document.getElementById("saved");

function cellKey(r,c){
    return r + "_" + c;
}

function columnName(n){

    let result="";

    while(n>=0){

        result =
            String.fromCharCode((n%26)+65)
            + result;

        n=Math.floor(n/26)-1;
    }

    return result;
}

function updateSize(){

    grid.style.width =
        (ROW_HEADER + cols*COL_WIDTH)+"px";

    grid.style.height =
        (HEADER_HEIGHT + rows*ROW_HEIGHT)+"px";
}

function render(){

    grid.innerHTML="";

    let top=sheet.scrollTop;
    let left=sheet.scrollLeft;

    let height=sheet.clientHeight;
    let width=sheet.clientWidth;

    let firstRow=
        Math.max(
            0,
            Math.floor(top/ROW_HEIGHT)-2
        );

    let lastRow=
        Math.min(
            rows,
            Math.ceil(
                (top+height)/ROW_HEIGHT
            )+2
        );

    let firstCol=
        Math.max(
            0,
            Math.floor(
                Math.max(
                    0,
                    left-ROW_HEADER
                )/COL_WIDTH
            )-2
        );

    let lastCol=
        Math.min(
            cols,
            Math.ceil(
                (left+width)/COL_WIDTH
            )+2
        );

    /* COLUMN HEADERS */

    for(
        let c=firstCol;
        c<lastCol;
        c++
    ){

        let h=document.createElement("div");

        h.className="cell header";

        h.textContent=columnName(c);

        h.style.left=
            (ROW_HEADER+c*COL_WIDTH)+"px";

        h.style.top="0px";

        grid.appendChild(h);
    }

    /* ROW HEADERS */

    for(
        let r=firstRow;
        r<lastRow;
        r++
    ){

        let h=document.createElement("div");

        h.className="cell header rowhead";

        h.textContent=r+1;

        h.style.top=
            (HEADER_HEIGHT+r*ROW_HEIGHT)+"px";

        grid.appendChild(h);
    }

    /* CELLS */

    for(
        let r=firstRow;
        r<lastRow;
        r++
    ){

        for(
            let c=firstCol;
            c<lastCol;
            c++
        ){

            let cell=document.createElement("div");

            cell.className="cell";

            cell.contentEditable=true;

            cell.dataset.row=r;
            cell.dataset.col=c;

            cell.style.left=
                (ROW_HEADER+c*COL_WIDTH)+"px";

            cell.style.top=
                (HEADER_HEIGHT+r*ROW_HEIGHT)+"px";

            let k=cellKey(r,c);

            if(data[k]!==undefined){

                cell.textContent=data[k];
            }

            cell.addEventListener(
                "focus",
                function(){

                    selectedRow=r;
                    selectedCol=c;

                    cellName.textContent=
                        columnName(c)+(r+1);

                    formula.value=
                        data[k]||"";
                }
            );

            cell.addEventListener(
                "input",
                function(){

                    let value=cell.innerText;

                    if(value.trim()===""){

                        delete data[k];

                    }else{

                        data[k]=value;
                    }

                    formula.value=value;

                    autoSave();

                    status.textContent=
                        columnName(c)+(r+1)+" edited";
                }
            );

            cell.addEventListener(
                "keydown",
                function(e){

                    if(e.key==="Enter"){

                        e.preventDefault();

                        focusCell(r+1,c);

                    }

                    if(e.key==="Tab"){

                        e.preventDefault();

                        focusCell(r,c+1);

                    }

                    if(e.key==="ArrowDown"){

                        e.preventDefault();

                        focusCell(r+1,c);

                    }

                    if(e.key==="ArrowUp"){

                        e.preventDefault();

                        focusCell(r-1,c);

                    }

                    if(e.key==="ArrowRight"){

                        e.preventDefault();

                        focusCell(r,c+1);

                    }

                    if(e.key==="ArrowLeft"){

                        e.preventDefault();

                        focusCell(r,c-1);
                    }

                }
            );

            grid.appendChild(cell);
        }
    }
}

function focusCell(r,c){

    if(r<0||c<0||r>=rows||c>=cols)
        return;

    let cell=document.querySelector(
        `.cell[data-row="${r}"][data-col="${c}"]`
    );

    if(!cell){

        sheet.scrollTop=
            Math.max(
                0,
                r*ROW_HEIGHT-
                sheet.clientHeight/2
            );

        sheet.scrollLeft=
            Math.max(
                0,
                c*COL_WIDTH-
                sheet.clientWidth/2
            );

        render();

        cell=document.querySelector(
            `.cell[data-row="${r}"][data-col="${c}"]`
        );
    }

    if(cell){

        cell.focus();

        selectedRow=r;
        selectedCol=c;

        cellName.textContent=
            columnName(c)+(r+1);

        formula.value=
            data[cellKey(r,c)]||"";
    }
}

function formulaChanged(){

    let value=formula.value;

    let k=cellKey(
        selectedRow,
        selectedCol
    );

    if(value===""){

        delete data[k];

    }else{

        data[k]=value;
    }

    render();

    autoSave();
}

function addRow(){

    if(rows>=MAX_ROWS){

        alert("Maximum 20,000 rows reached.");

        return;
    }

    rows++;

    updateSize();
    render();
    autoSave();

    status.textContent="Row added";
}

function deleteRow(){

    if(rows<=1)return;

    for(
        let c=0;
        c<cols;
        c++
    ){

        delete data[
            cellKey(rows-1,c)
        ];
    }

    rows--;

    updateSize();
    render();
    autoSave();

    status.textContent="Last row deleted";
}

function addColumn(){

    if(cols>=MAX_COLS){

        alert("Maximum 500 columns reached.");

        return;
    }

    cols++;

    updateSize();
    render();
    autoSave();

    status.textContent="Column added";
}

function deleteColumn(){

    if(cols<=1)return;

    for(
        let r=0;
        r<rows;
        r++
    ){

        delete data[
            cellKey(r,cols-1)
        ];
    }

    cols--;

    updateSize();
    render();
    autoSave();

    status.textContent="Last column deleted";
}

function save(){

    localStorage.setItem(
        "MY_BUSINESS_SHEET",
        JSON.stringify({
            data:data,
            rows:rows,
            cols:cols
        })
    );

    saved.textContent="Saved ✓";

    status.textContent="Data saved";

    setTimeout(
        ()=>{
            saved.textContent="Saved locally ✓";
        },
        1500
    );
}

function autoSave(){

    localStorage.setItem(
        "MY_BUSINESS_SHEET",
        JSON.stringify({
            data:data,
            rows:rows,
            cols:cols
        })
    );

    saved.textContent="Saving...";

    clearTimeout(window.saveTimer);

    window.saveTimer=setTimeout(
        ()=>{
            saved.textContent="Saved locally ✓";
        },
        300
    );
}

function load(){

    let savedData=
        localStorage.getItem(
            "MY_BUSINESS_SHEET"
        );

    if(savedData){

        try{

            let obj=JSON.parse(savedData);

            data=obj.data||{};

            rows=obj.rows||200;

            cols=obj.cols||20;

        }catch(e){

            console.log(e);
        }
    }

    updateSize();
    render();
}

function clearAll(){

    if(
        !confirm(
            "Are you sure you want to delete ALL business data?"
        )
    )return;

    data={};

    rows=200;
    cols=20;

    save();

    updateSize();
    render();

    status.textContent="Everything cleared";
}

function exportCSV(){

    let csv="";

    for(
        let r=0;
        r<rows;
        r++
    ){

        let line=[];

        for(
            let c=0;
            c<cols;
            c++
        ){

            let value=
                data[cellKey(r,c)]||"";

            value=
                String(value)
                .replace(/"/g,'""');

            line.push('"'+value+'"');
        }

        csv+=line.join(",")+"\n";
    }

    let blob=new Blob(
        [csv],
        {
            type:"text/csv;charset=utf-8"
        }
    );

    let url=
        URL.createObjectURL(blob);

    let a=
        document.createElement("a");

    a.href=url;

    a.download=
        "my-business-data.csv";

    a.click();

    URL.revokeObjectURL(url);

    status.textContent="CSV exported";
}

document
.getElementById("file")
.addEventListener(
    "change",
    function(e){

        let file=e.target.files[0];

        if(!file)return;

        let reader=new FileReader();

        reader.onload=function(){

            let lines=
                reader.result
                .split(/\r?\n/);

            data={};

            let maxCols=0;

            lines.forEach(
                (line,r)=>{

                    if(!line.trim())return;

                    let values=
                        parseCSV(line);

                    maxCols=
                        Math.max(
                            maxCols,
                            values.length
                        );

                    values.forEach(
                        (value,c)=>{

                            if(value!==""){

                                data[
                                    cellKey(r,c)
                                ]=value;
                            }
                        }
                    );
                }
            );

            rows=Math.min(
                Math.max(lines.length,200),
                MAX_ROWS
            );

            cols=Math.min(
                Math.max(maxCols,20),
                MAX_COLS
            );

            updateSize();
            render();
            save();

            status.textContent="CSV imported";
        };

        reader.readAsText(file);
    }
);

function parseCSV(line){

    let result=[];
    let current="";
    let quotes=false;

    for(
        let i=0;
        i<line.length;
        i++
    ){

        let ch=line[i];

        if(ch==='"'){

            if(
                quotes &&
                line[i+1]==='"'
            ){

                current+='"';
                i++;

            }else{

                quotes=!quotes;
            }

        }else if(
            ch==="," &&
            !quotes
        ){

            result.push(current);
            current="";

        }else{

            current+=ch;
        }
    }

    result.push(current);

    return result;
}

function searchData(){

    let search=
        document
        .getElementById("search")
        .value
        .toLowerCase();

    if(!search){

        status.textContent="Ready";

        return;
    }

    for(
        let k in data
    ){

        if(
            String(data[k])
            .toLowerCase()
            .includes(search)
        ){

            let parts=k.split("_");

            let r=Number(parts[0]);
            let c=Number(parts[1]);

            focusCell(r,c);

            status.textContent=
                "Found: "+
                columnName(c)+
                (r+1);

            return;
        }
    }

    status.textContent="Not found";
}

sheet.addEventListener(
    "scroll",
    function(){

        render();
    }
);

load();

</script>

</body>
</html>
